name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  next-static-config-template:
    name: Next static config template
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-static-config-template

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: next-static-config-template/.nvmrc
          cache: npm
          cache-dependency-path: next-static-config-template/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate, test, and build
        run: npm run check

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: next-static-config-template/playwright-report/
          if-no-files-found: ignore
