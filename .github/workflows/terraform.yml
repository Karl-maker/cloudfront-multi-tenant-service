name: Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Bootstrap Terraform state
        run: ./bin/bootstrap-tf-state.sh

      - name: Init Terraform
        run: terraform -chdir=infra init

      - name: Validate Terraform
        run: terraform -chdir=infra validate

      - name: Plan Terraform
        run: terraform -chdir=infra plan -out=tfplan

      - name: Apply Terraform
        if: inputs.action == 'apply'
        run: terraform -chdir=infra apply -auto-approve tfplan

      - name: Read Terraform outputs
        if: inputs.action == 'apply'
        run: |
          echo "CONTENT_BUCKET=$(terraform -chdir=infra output -raw content_bucket_name)" >> "$GITHUB_ENV"
          echo "CLOUDFRONT_DISTRIBUTION_ID=$(terraform -chdir=infra output -raw cloudfront_distribution_id)" >> "$GITHUB_ENV"

      - name: Upload global 404 page
        if: inputs.action == 'apply'
        run: npm run deploy:global-404
