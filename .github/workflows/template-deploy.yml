name: Deploy Changed Templates And Sites

on:
  push:
    branches:
      - main
    paths:
      - "templates/**"
      - "sites/**"
      - "bin/syncpoly-site.js"
      - "cloudfront/**"
      - ".github/workflows/template-deploy.yml"
  workflow_dispatch:
    inputs:
      templates:
        description: "Optional comma-separated template keys to deploy. Leave blank to deploy all registered templates."
        required: false
        type: string
      sites:
        description: "Optional comma-separated site folders to deploy. Leave blank to deploy all sites when templates change."
        required: false
        type: string

jobs:
  deploy-changed-templates:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      CONTENT_BUCKET: syncpoly-web-builder-sites

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect changed templates
        id: changes
        shell: bash
        env:
          EXPLICIT_TEMPLATES: ${{ inputs.templates }}
          EXPLICIT_SITES: ${{ inputs.sites }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -n "${EXPLICIT_TEMPLATES:-}" ]]; then
              changed_files=""
            else
              changed_files="$(find templates -type f | sort)"
            fi
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            if [[ "$(git rev-list --count HEAD)" -gt 1 ]]; then
              changed_files="$(git diff --name-only HEAD~1 HEAD)"
            else
              changed_files="$(git ls-tree -r --name-only HEAD)"
            fi
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
          fi

          changed_template_dirs="$(
            awk -F/ '/^templates\/[^/]+\// { print $2 }' <<< "$changed_files" | sort -u | tr '\n' ' '
          )"
          changed_site_dirs="$(
            awk -F/ '/^sites\/[^/]+\// { print $2 }' <<< "$changed_files" | sort -u | tr '\n' ' '
          )"

          registry_changed=false
          if grep -qx 'templates/templates.json' <<< "$changed_files"; then
            registry_changed=true
          fi

          deploy_all_sites=false
          if grep -Eq '^(templates/|bin/syncpoly-site\.js|cloudfront/|\.github/workflows/template-deploy\.yml)' <<< "$changed_files"; then
            deploy_all_sites=true
          fi

          CHANGED_TEMPLATE_DIRS="$changed_template_dirs" \
          CHANGED_SITE_DIRS="$changed_site_dirs" \
          REGISTRY_CHANGED="$registry_changed" \
          DEPLOY_ALL_SITES="$deploy_all_sites" \
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("fs");

          const registry = JSON.parse(fs.readFileSync("templates/templates.json", "utf8")).templates || {};
          const explicit = (process.env.EXPLICIT_TEMPLATES || "")
            .split(/[,\s]+/)
            .map((value) => value.trim())
            .filter(Boolean);
          const explicitSites = (process.env.EXPLICIT_SITES || "")
            .split(/[,\s]+/)
            .map((value) => value.trim())
            .filter(Boolean);
          const changedDirs = new Set(
            (process.env.CHANGED_TEMPLATE_DIRS || "")
              .split(/\s+/)
              .map((value) => value.trim())
              .filter(Boolean)
          );
          const changedSites = new Set(
            (process.env.CHANGED_SITE_DIRS || "")
              .split(/\s+/)
              .map((value) => value.trim())
              .filter(Boolean)
          );
          const registryChanged = process.env.REGISTRY_CHANGED === "true";
          const deployAllSites = process.env.DEPLOY_ALL_SITES === "true" || registryChanged;

          function sourceFolder(name, entry) {
            const source = String((entry && entry.source) || name || "").replace(/^\.?\/*templates\//, "");
            return source.split(/[\\/]/)[0];
          }

          function hasConfig(site) {
            return fs.existsSync(`sites/${site}/site.config.json`);
          }

          const names = explicit.length > 0
            ? explicit
            : Object.entries(registry)
                .filter(([name, entry]) => registryChanged || changedDirs.has(name) || changedDirs.has(sourceFolder(name, entry)))
                .map(([name]) => name);

          const uniqueNames = [...new Set(names)].filter((name) => registry[name]);
          const sourceNames = [
            ...new Set(uniqueNames.map((name) => sourceFolder(name, registry[name])))
          ].filter((source) => fs.existsSync(`templates/${source}/package.json`));
          const allSites = fs.existsSync("sites")
            ? fs.readdirSync("sites", { withFileTypes: true })
                .filter((entry) => entry.isDirectory() && hasConfig(entry.name))
                .map((entry) => entry.name)
            : [];
          const siteNames = explicitSites.length > 0
            ? explicitSites.filter(hasConfig)
            : (deployAllSites ? allSites : [...changedSites].filter(hasConfig));
          console.log(`templates=${uniqueNames.join(",")}`);
          console.log(`sources=${sourceNames.join(",")}`);
          console.log(`has_changes=${uniqueNames.length > 0 ? "true" : "false"}`);
          console.log(`sites=${[...new Set(siteNames)].join(",")}`);
          console.log(`has_site_changes=${siteNames.length > 0 ? "true" : "false"}`);
          NODE

      - name: Build changed template exports
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          IFS=',' read -ra source_names <<< "${{ steps.changes.outputs.sources }}"
          for source_name in "${source_names[@]}"; do
            [[ -n "$source_name" ]] || continue
            template_dir="templates/$source_name"
            echo "Building $template_dir"
            npm ci --include=dev --prefix "$template_dir"
            npm run build --prefix "$template_dir" -- --webpack
          done

      - name: Upload changed templates
        if: steps.changes.outputs.has_changes == 'true'
        run: node bin/syncpoly-site.js upload-templates --templates "${{ steps.changes.outputs.templates }}"

      - name: Invalidate changed template paths
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          distribution_id="$(
            aws cloudfront list-distributions \
              --query "DistributionList.Items[?Aliases.Items && contains(Aliases.Items, '*.syncpoly.com')].Id | [0]" \
              --output text
          )"

          if [[ -z "$distribution_id" || "$distribution_id" == "None" ]]; then
            echo "::notice title=CloudFront invalidation skipped::No distribution with *.syncpoly.com alias was found."
            exit 0
          fi

          IFS=',' read -ra template_names <<< "${{ steps.changes.outputs.templates }}"
          paths=()
          for template_name in "${template_names[@]}"; do
            [[ -n "$template_name" ]] || continue
            paths+=("/syncpoly/templates/$template_name/*")
          done

          if [[ "${#paths[@]}" -eq 0 ]]; then
            exit 0
          fi

          aws cloudfront create-invalidation \
            --distribution-id "$distribution_id" \
            --paths "${paths[@]}"

      - name: Build and upload site-specific HTML
        if: steps.changes.outputs.has_site_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          npm ci --include=dev --prefix templates/real-estate

          IFS=',' read -ra site_names <<< "${{ steps.changes.outputs.sites }}"
          for site_name in "${site_names[@]}"; do
            [[ -n "$site_name" ]] || continue
            site_dir="sites/$site_name"
            config_file="$site_dir/site.config.json"

            echo "Uploading runtime config for $site_name"
            node bin/syncpoly-site.js upload-config --file "$config_file"

            if [[ -d "$site_dir/media" ]]; then
              echo "Uploading media for $site_name"
              node bin/syncpoly-site.js upload-media --source "$site_dir/media" --config "$config_file"
            fi

            echo "Uploading SEO discovery files for $site_name"
            node bin/syncpoly-site.js upload-seo --source "$site_dir" --config "$config_file"

            echo "Building and uploading site-specific HTML for $site_name"
            node bin/syncpoly-site.js upload-site-html --site "$site_dir" --template real-estate
          done

      - name: Invalidate site-specific paths
        if: steps.changes.outputs.has_site_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          distribution_id="$(
            aws cloudfront list-distributions \
              --query "DistributionList.Items[?Aliases.Items && contains(Aliases.Items, '*.syncpoly.com')].Id | [0]" \
              --output text
          )"

          if [[ -z "$distribution_id" || "$distribution_id" == "None" ]]; then
            echo "::notice title=CloudFront invalidation skipped::No distribution with *.syncpoly.com alias was found."
            exit 0
          fi

          aws cloudfront create-invalidation \
            --distribution-id "$distribution_id" \
            --paths "/*"

      - name: Report no template changes
        if: steps.changes.outputs.has_changes != 'true' && steps.changes.outputs.has_site_changes != 'true'
        run: echo "No registered template or site folders changed."
