name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Check Terraform formatting
        run: terraform -chdir=infra fmt -check

      - name: Validate Terraform
        run: terraform -chdir=infra init -backend=false && terraform -chdir=infra validate

  auth-localstack-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start LocalStack
        shell: bash
        run: |
          set -euo pipefail

          docker compose --profile test up -d localstack

          for attempt in {1..60}; do
            if curl -fsS http://localhost:4566/_localstack/health >/dev/null; then
              docker compose --profile test ps localstack
              exit 0
            fi

            container_id="$(docker compose --profile test ps -q localstack)"
            state="$(docker inspect -f '{{.State.Status}}' "$container_id" 2>/dev/null || true)"
            if [[ "$state" == "exited" || "$state" == "dead" ]]; then
              docker compose --profile test ps localstack
              docker compose --profile test logs localstack
              exit 1
            fi

            sleep 2
          done

          docker compose --profile test ps localstack
          docker compose --profile test logs localstack
          exit 1

      - name: Run LocalStack auth integration tests
        run: npm run test:integration

      - name: Run LocalStack auth e2e tests
        run: npm run test:e2e

      - name: Stop LocalStack
        if: always()
        run: docker compose --profile test down -v
